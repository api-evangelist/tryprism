name: Tryprism
description: Prism (tryprism.com) is a San Francisco, Y Combinator-backed AI-powered
  recruiting agency that delivers qualified talent leads to hiring teams faster and
  more affordably than traditional recruiters. Clients describe the role they need
  to fill, Prism's AI handles sourcing, screening, and candidate outreach end-to-end,
  and clients interview only pre-screened candidates. Pricing is 15% of first-year
  salary per hire (versus the typical 20-30% agency fee) plus a retainer to initiate
  and prioritize the search, charged only when a hire is made. As of this profile
  Prism operates as a managed recruiting service and publishes no public developer
  API, SDK, documentation, or discovery surface.
